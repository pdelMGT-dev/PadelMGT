<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a4ed8"></stop>
      <stop offset="0.5" stop-color="#0d2d8a"></stop>
      <stop offset="1" stop-color="#061025"></stop>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"></path>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#court)"></rect>
  <rect width="1600" height="900" fill="url(#grid)"></rect>
  
  <g stroke="rgba(255,255,255,0.45)" stroke-width="3" fill="none">
    <rect x="200" y="180" width="1200" height="540" rx="2"></rect>
    <line x1="800" y1="180" x2="800" y2="720"></line>
    <line x1="200" y1="450" x2="1400" y2="450" stroke-width="2" stroke-dasharray="4,8"></line>
    <line x1="500" y1="180" x2="500" y2="720" stroke-width="2"></line>
    <line x1="1100" y1="180" x2="1100" y2="720" stroke-width="2"></line>
  </g>
  
  <g stroke="rgba(255,255,255,0.7)" stroke-width="2">
    <line x1="800" y1="180" x2="800" y2="720"></line>
    <line x1="700" y1="180" x2="700" y2="720" stroke-width="1" stroke-dasharray="2,3"></line>
    <line x1="900" y1="180" x2="900" y2="720" stroke-width="1" stroke-dasharray="2,3"></line>
  </g>
  
  <circle cx="1080" cy="510" r="14" fill="#d6ff00"></circle>
</svg>